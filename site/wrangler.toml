# Deploys: Cloudflare dashboard Builds integration (Workers & Pages →
# network-jobs-landing → Settings → Builds) watches this repo, root `site`,
# watch paths `site/**`. Push to main to ship; avoid manual `wrangler deploy`
# from stale checkouts.
#
# Branch builds: Workers Builds runs the Preview command (default
# `npx wrangler preview`) for every non-production branch. Wrangler refuses
# that command unless the config has a `previews` block, so without it every
# PR build fails while main stays green. This Worker has no preview-specific
# settings (assets and compatibility stay top level), so the block is empty.
name = "network-jobs-landing"
main = "src/index.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
account_id = "6034f1c5d23e5503f6573740480cf0d6"
workers_dev = true
preview_urls = true
previews = { }

[assets]
directory = "./public"
binding = "ASSETS"

# Production routes (most-specific wins, so these coexist with the main
# hirefrank.com site like bfs-lunch-menu does):
[[routes]]
pattern = "hirefrank.com/network-jobs*"
zone_name = "hirefrank.com"

[[routes]]
pattern = "www.hirefrank.com/network-jobs*"
zone_name = "hirefrank.com"

[dev]
ip = "0.0.0.0"
port = 45455

[observability]
enabled = true
head_sampling_rate = 1
