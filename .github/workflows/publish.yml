name: publish

# Publishes on an annotated/lightweight version tag, using npm trusted
# publishing (OIDC): no NPM_TOKEN, no 2FA step-up, provenance automatic.
# Requires a one-time trusted-publisher entry on npmjs.com — see
# docs/RELEASE.md. Until that exists this workflow will fail at the publish
# step (safe: nothing is published).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v5

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships 11.x.
      # Deliberately no registry-url: setup-node would write an .npmrc with
      # an unset ${NODE_AUTH_TOKEN}, which breaks the OIDC path.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      - name: Run helper test suite
        run: bash tests/run.sh

      - name: Check CLI syntax
        run: bash -n bin/network-jobs setup lib/agents.sh

      - name: Publish to npm
        run: npm publish

  release:
    # Only after npm accepted the version: a failed publish must not leave a
    # GitHub release that points at an unavailable package.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it alone."
            exit 0
          fi

          # Use the curated CHANGELOG section for this version. The heading is
          # `## vX.Y.Z — YYYY-MM-DD`; stop at the next version heading.
          version="${tag#v}"
          notes="$(mktemp)"
          awk -v ver="$version" '
            $0 ~ ("^## v" ver "( |$)") { inside = 1; next }
            inside && /^## v/ { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"

          if [ -s "$notes" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$notes" --latest
          else
            echo "::warning::No CHANGELOG section for $tag; using generated notes"
            gh release create "$tag" --title "$tag" --generate-notes --latest
          fi
